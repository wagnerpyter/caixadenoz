<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Caixa de Nós — um universo observável em formação.">
  <title>Caixa de Nós</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1014;
      --ink: #d9e1df;
      --muted: #81908d;
      --line: #273337;
      --accent: #6ab5c5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, #17252b 0, var(--bg) 48%);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    main {
      width: min(680px, calc(100% - 3rem));
      padding: 3rem 0;
    }

    .signal {
      width: 3rem;
      height: 1px;
      margin-bottom: 2rem;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 1rem 0 3rem;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    blockquote {
      margin: 0;
      padding-left: 1.25rem;
      border-left: 1px solid var(--accent);
      color: var(--ink);
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      line-height: 1.55;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: .8rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="signal" aria-hidden="true"></div>
    <h1>Caixa de Nós</h1>
    <p class="subtitle">Um universo observável em formação.</p>
    <blockquote>
      O dado entra como sinal.<br>
      A falha devolve uma ferida.<br>
      O que retorna recebe o nome provisório de memória.
    </blockquote>
    <footer>
      estado: aberto · origem: não determinada · espera: ativa
    </footer>
  </main>
</body>
</html>
